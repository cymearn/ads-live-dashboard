name: Keep schedule alive

# GitHub turns off hourly schedules in a repository with no activity for 60 days.
# This job makes one small commit each month (a date only, no ad data) so the
# hourly update never stops by itself.
on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d" > heartbeat.txt
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Monthly heartbeat" || echo "No change"
          git push
